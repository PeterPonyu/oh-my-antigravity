name: verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run audit:deps

  pack-smoke:
    name: pack-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Build, pack, install, and run the built CLI. Proves the shipped artifact
      # works on the engines lower bound (Node 22), where running .ts is unsupported.
      - run: npm run smoke:pack

  e2e-self:
    name: full user-journey e2e (deterministic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with: { node-version: '22' }
      - run: npm ci
      # e2e:self is the deterministic credential-free self-journey this job's
      # name promises. The genuine model-backed tier lives in the dispatch-only
      # e2e-real-required job (it installs gemini-cli and uses the secret);
      # e2e:real here could never pass — no gemini CLI, no credential.
      - run: npm run e2e:self
        timeout-minutes: 10

  e2e-headless:
    name: headless e2e (credential-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm install -g @google/gemini-cli@0.45.0
      - run: npm run e2e:headless
        timeout-minutes: 10

  e2e-real-required:
    name: real-host e2e (credential required, dispatch only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm install -g @google/gemini-cli@0.45.0
      - name: run real-host e2e (hard-fail)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OAG_E2E_REQUIRE_REAL: '1'
        run: npm run e2e:real
        timeout-minutes: 15

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2
